name: Render video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-video.yml'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Composition ID registered in src/projects/registry.ts"
        required: true
        default: "TunasDewa"
        type: string
      output_filename:
        description: "MP4 filename (without folders)"
        required: true
        default: "tunas-dewa.mp4"
        type: string
      asset_project_id:
        description: "Base project workspace ID for asset validation. Defaults to composition_id; set this for aspect-ratio variants."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: imperal-video-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-render]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate build script syntax
        run: find scripts -type f -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: TypeScript validation
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Discover and validate registered compositions
        run: npm run compositions

      - name: Validate render inputs
        env:
          COMPOSITION_ID: ${{ inputs.composition_id || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'SaifulSagita') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'GalaxyEducation') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'KyandraRoast') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'TrigonometriPraktik') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'ImperialSolTeaser') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'TunasPohon') || 'TunasDewa' }}
          ASSET_PROJECT_ID: ${{ inputs.asset_project_id || '' }}
          OUTPUT_FILENAME: ${{ inputs.output_filename || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'saiful-dan-sagita.mp4') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'tata-surya-bima-sakti.mp4') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'kyandra-roast.mp4') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'praktik-trigonometri.mp4') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'imperial-sol-teaser.mp4') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'tunas-pohon.mp4') || 'tunas-dewa.mp4' }}
        run: |
          if [[ ! "$COMPOSITION_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid composition ID"
            exit 1
          fi
          if [[ ! "$OUTPUT_FILENAME" =~ ^[A-Za-z0-9_-]+\.mp4$ ]]; then
            echo "Filename must contain only letters, numbers, dash, underscore, and end in .mp4"
            exit 1
          fi
          if [[ -z "$ASSET_PROJECT_ID" ]]; then
            ASSET_PROJECT_ID="$COMPOSITION_ID"
          fi
          if [[ ! "$ASSET_PROJECT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]; then
            echo "Invalid asset project ID"
            exit 1
          fi
          echo "ASSET_PROJECT_ID=$ASSET_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate project asset release readiness
        run: node scripts/render-preflight.cjs "$ASSET_PROJECT_ID"

      - name: Set up Python for neural narration
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install neural Indonesian TTS
        run: |
          python -m venv .venv-tts
          .venv-tts/bin/python -m pip install --upgrade pip
          .venv-tts/bin/python -m pip install edge-tts==7.3.1

      - name: Install FFmpeg for narration assembly and duration measurement
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate original music and sound effects
        run: node scripts/generate-audio.cjs

      - name: Generate composition-specific Indonesian neural narration
        env:
          COMPOSITION_ID: ${{ inputs.composition_id || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'SaifulSagita') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'GalaxyEducation') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'KyandraRoast') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'TrigonometriPraktik') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'ImperialSolTeaser') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'TunasPohon') || 'TunasDewa' }}
          TTS_VOICE: id-ID-ArdiNeural
          TTS_RATE: -4%
          TTS_PITCH: -2Hz
        run: |
          if [ "$COMPOSITION_ID" = "ImperialSolTeaser" ]; then
            node scripts/generate-imperial-sol-voice.cjs
          elif [ "$COMPOSITION_ID" = "TunasDewa" ]; then
            node scripts/generate-tunas-dewa-voice.cjs
          elif [ "$COMPOSITION_ID" = "TunasPohon" ]; then
            node scripts/generate-tunas-pohon-voice.cjs
          elif [ "$COMPOSITION_ID" = "TrigonometriPraktik" ]; then
            node scripts/generate-trigonometri-voice.cjs
          elif [ "$COMPOSITION_ID" = "GalaxyEducation" ]; then
            node scripts/generate-galaxy-voice.cjs
          elif [ "$COMPOSITION_ID" = "SaifulSagita" ]; then
            node scripts/generate-saiful-sagita-voice.cjs
          elif [ "$COMPOSITION_ID" = "KyandraRoast" ]; then
            node scripts/generate-kyandra-voice.cjs
          fi

      - name: Resolve adaptive cinematic render profile
        run: node scripts/render-profile.cjs --github-env

      - name: Render MP4
        env:
          COMPOSITION_ID: ${{ inputs.composition_id || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'SaifulSagita') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'GalaxyEducation') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'KyandraRoast') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'TrigonometriPraktik') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'ImperialSolTeaser') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'TunasPohon') || 'TunasDewa' }}
          OUTPUT_FILENAME: ${{ inputs.output_filename || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'saiful-dan-sagita.mp4') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'tata-surya-bima-sakti.mp4') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'kyandra-roast.mp4') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'praktik-trigonometri.mp4') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'imperial-sol-teaser.mp4') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'tunas-pohon.mp4') || 'tunas-dewa.mp4' }}
        run: |
          mkdir -p out
          npx remotion render src/index.tsx "$COMPOSITION_ID" "out/$OUTPUT_FILENAME" --concurrency="$RENDER_CONCURRENCY" --scale="$RENDER_SCALE" --jpeg-quality="$RENDER_JPEG_QUALITY" --crf="$RENDER_CRF" --log=verbose

      - name: Validate rendered MP4 streams and metadata
        env:
          OUTPUT_FILENAME: ${{ inputs.output_filename || (contains(github.event.head_commit.message, '[render:saiful-sagita]') && 'saiful-dan-sagita.mp4') || ((contains(github.event.head_commit.message, '[render:galaxy]') || contains(github.event.head_commit.message, '[test:galaxy]')) && 'tata-surya-bima-sakti.mp4') || (contains(github.event.head_commit.message, '[render:kyandra]') && 'kyandra-roast.mp4') || (contains(github.event.head_commit.message, '[render:trigonometri]') && 'praktik-trigonometri.mp4') || (contains(github.event.head_commit.message, '[render:imperial-sol]') && 'imperial-sol-teaser.mp4') || (contains(github.event.head_commit.message, '[render:tunas-pohon]') && 'tunas-pohon.mp4') || 'tunas-dewa.mp4' }}
        run: node scripts/validate-render.cjs

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperal-video-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
